<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./cs.css" />
    <title>библиотека</title>
  </head>
  <body>
    <header>библиотека</header>

    <div class="container">
      <button id="addBookButton">Добавить книгу</button>
    </div>

    <div class="overlay" id="overlay"></div>

    <form id="bookForm">
      <h3>Новая книга</h3>
      <input type="text" id="title" placeholder="Название" required />
      <input type="text" id="author" placeholder="Автор" required />
      <input type="number" id="pages" placeholder="Страниц" required />
      <div>
        <label
          ><input type="radio" name="isRead" value="yes" /> Прочитано</label
        >
        <label
          ><input type="radio" name="isRead" value="no" checked /> Не
          прочитано</label
        >
      </div>
      <button type="submit">Сохранить</button>
    </form>

    <div id="library"></div>

    <script src="./app.js"></script>
  </body>
</html>
